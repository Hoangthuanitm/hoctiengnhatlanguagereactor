<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nihongo Mỗi Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Màu sắc (sáng / tối) ===== */
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2127;--muted:#6b7079;--line:#e4e0d6;--accent:#c2410c;--accent-ink:#fff;--accent-soft:#fcebe1;--ok:#15803d;--ok-soft:#e6f5eb;--ng:#b91c1c;--ng-soft:#fcebeb;--hard:#a16207;--hard-soft:#fbf3dc;--easy:#1d4ed8;--easy-soft:#e7eefc;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131518;--card:#1d2024;--ink:#ebe9e4;--muted:#9a9fa7;--line:#2f333a;--accent:#fb923c;--accent-ink:#1a1206;--accent-soft:#3a2416;--ok:#4ade80;--ok-soft:#14301f;--ng:#f87171;--ng-soft:#3a1b1b;--hard:#facc15;--hard-soft:#352c10;--easy:#93b4ff;--easy-soft:#1b2640;--shadow:none}}
:root[data-theme="dark"]{--bg:#131518;--card:#1d2024;--ink:#ebe9e4;--muted:#9a9fa7;--line:#2f333a;--accent:#fb923c;--accent-ink:#1a1206;--accent-soft:#3a2416;--ok:#4ade80;--ok-soft:#14301f;--ng:#f87171;--ng-soft:#3a1b1b;--hard:#facc15;--hard-soft:#352c10;--easy:#93b4ff;--easy-soft:#1b2640;--shadow:none}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 96px}
.muted{color:var(--muted)}.small{font-size:13px}
h2,h3{margin:0;line-height:1.3}h2{font-size:21px}h3{font-size:17px}

/* ===== Đầu trang + thanh tab ===== */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Noto Sans JP";font-size:18px}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{background:var(--accent-soft);color:var(--accent)}
body.in-session nav.tabs{visibility:hidden}
@media (max-width:640px){
 nav.tabs{position:fixed;left:0;right:0;bottom:0;border-radius:0;border-width:1px 0 0;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
 .tab{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:4px 6px;flex:1}
 .tab i{font-style:normal;font-size:18px}
 body.in-session nav.tabs{display:none}
}
@media (min-width:641px){.tab i{font-style:normal;margin-right:5px}}

/* ===== Thẻ, nút ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions.center{justify-content:center}
.icon{border:0;background:var(--accent-soft);color:var(--accent);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px;display:inline-grid;place-items:center;flex:none}
.icon.sm{width:30px;height:30px;font-size:14px;vertical-align:middle}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.badge{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}
.b-new{background:var(--easy-soft);color:var(--easy)}.b-learn{background:var(--hard-soft);color:var(--hard)}.b-done{background:var(--ok-soft);color:var(--ok)}

/* ===== Trang Hôm nay ===== */
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.streak{text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:6px 12px;min-width:64px;line-height:1.1}
.streak b{display:block;font-size:22px}.streak span{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;position:relative;min-width:0}
.chip .w{font-size:20px;font-weight:700}.chip .r{font-size:13px;color:var(--accent)}.chip .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--ok);font-weight:700}
.due-num{font-size:34px;font-weight:700;color:var(--accent);line-height:1}

/* ===== Phiên học ===== */
.ses-head{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.flash{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:6px;padding:26px 18px}
.tag{font-size:12px;color:var(--muted);background:var(--bg);border-radius:99px;padding:2px 10px}
.big{font-size:52px;font-weight:700;line-height:1.35;word-break:break-word}
.rdl{display:block;font-size:.34em;font-weight:500;color:var(--accent);line-height:1.4}
.big rt{font-size:17px;font-weight:500;color:var(--accent)}
.hint{margin-top:10px;font-size:14px}
.detail{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.ro{color:var(--muted);font-style:italic}
.mean{font-size:21px;font-weight:600}
.row-btn{display:flex;gap:8px;justify-content:center}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;width:100%;max-width:560px;text-align:left}
.ex .jp{font-size:17px}
mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 2px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;padding:8px 4px}
.rate small{font-weight:400;font-size:12px;opacity:.8}
.rate-1{background:var(--ng-soft);color:var(--ng);border-color:transparent}
.rate-2{background:var(--hard-soft);color:var(--hard);border-color:transparent}
.rate-3{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rate-4{background:var(--easy-soft);color:var(--easy);border-color:transparent}
.qtype{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.prompt{text-align:center;padding:12px 0 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.big-vn{font-size:26px;font-weight:700}
.sent{font-size:22px;line-height:1.7}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);color:transparent}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font:600 12px/1 "Be Vietnam Pro";background:var(--bg);border-radius:6px;padding:5px 7px;color:var(--muted);flex:none}
.opt span.jp{font-size:20px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.type-row{display:flex;gap:8px}
.type-row input{flex:1;min-width:0;font-size:20px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.type-row input:focus{outline:none;border-color:var(--accent)}
.fb{margin-top:16px;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.fb.ok{background:var(--ok-soft)}.fb.ng{background:var(--ng-soft)}
.fb-title{font-weight:700;font-size:18px}.fb.ok .fb-title{color:var(--ok)}.fb.ng .fb-title{color:var(--ng)}
.fb-word{font-size:30px;font-weight:700}.fb-word rt{font-size:14px;color:var(--accent)}
.fb .ex{background:var(--card)}
.fb .next{margin-top:6px;min-width:200px}
.finish{text-align:center;padding:30px 18px}
.big-emoji{font-size:54px}
.score{font-size:44px;font-weight:700;color:var(--accent)}

/* ===== Kho từ / cài đặt ===== */
.filters{display:grid;grid-template-columns:1fr auto auto;gap:8px}
@media (max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
.field,.filters input,.filters select,select.field{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
.vrow{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vw .w{font-size:19px;font-weight:700;display:block;word-break:break-word}.vw .r{font-size:13px;color:var(--accent)}
.vact{display:flex;gap:4px}
@media (max-width:520px){.vrow{grid-template-columns:1fr auto}.vm{grid-column:1/-1;grid-row:2}}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row label{flex:1}
.set-row input[type=number],.set-row input[type=time],.set-row select{width:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px}
.set-row input[type=checkbox],.grp input{width:20px;height:20px;accent-color:var(--accent)}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;max-height:300px;overflow:auto;padding:4px 0}
.grp{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
textarea.field{min-height:110px;resize:vertical}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin:8px 0}
.note b{color:var(--ink)}
.note ol{margin:4px 0;padding-left:20px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:16px 0 0}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
.cloud{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--bg);color:var(--muted);white-space:nowrap;cursor:default}
.cloud.ok{color:var(--ok);background:var(--ok-soft)}.cloud.err{color:var(--ng);background:var(--ng-soft)}.cloud.saving,.cloud.loading{color:var(--hard);background:var(--hard-soft)}
.hv{font-size:14px;color:var(--muted)}.hv b{color:var(--ink);font-weight:600}
.wnote{font-size:13px;color:var(--muted);max-width:560px}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="brand"><span class="logo">日</span>Nihongo Mỗi Ngày <span id="cloud" class="cloud loading" title="">☁️ …</span></div>
  <nav class="tabs">
   <button class="tab" data-act="tab" data-v="today"><i>🏠</i>Hôm nay</button>
   <button class="tab" data-act="tab" data-v="review"><i>🔁</i>Ôn tập</button>
   <button class="tab" data-act="tab" data-v="vocab"><i>📚</i>Kho từ</button>
   <button class="tab" data-act="tab" data-v="settings"><i>⚙️</i>Cài đặt</button>
  </nav>
 </header>
 <main id="main"></main>
</div>

<dialog id="dlg">
 <form method="dialog" id="editForm">
  <h3 id="dlgTitle">Sửa từ</h3>
  <label>Từ tiếng Nhật *</label><input class="field jp" name="w" required>
  <label>Cách đọc (hiragana/katakana)</label><input class="field jp" name="r">
  <label>Romaji</label><input class="field" name="ro">
  <label>Hán Việt</label><input class="field" name="hv">
  <label>Nghĩa tiếng Việt *</label><input class="field" name="m" required>
  <label>Câu ví dụ</label><input class="field jp" name="ex">
  <label>Dịch câu ví dụ</label><input class="field" name="exTr">
  <label>Ghi chú</label><input class="field" name="note">
  <label>Nhóm</label><input class="field" name="g" list="grpList"><datalist id="grpList"></datalist>
  <menu><button class="btn ghost" value="cancel" formnovalidate>Huỷ</button><button class="btn primary" value="ok">Lưu</button></menu>
 </form>
</dialog>
<div id="toast"></div>

/* ================= XỬ LÝ CHỮ NHẬT ================= */
const kata2hira=s=>String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const hasKanji=s=>/[㐀-䶿一-鿿々]/.test(s||'');
const isKana=s=>/^[぀-ヿ\s　]+$/.test(s||'');
const normKey=w=>kata2hira(String(w||'').normalize('NFKC').replace(/[\s　]+/g,'')).toLowerCase();
const cleanKana=s=>kata2hira(String(s||'').normalize('NFKC')).replace(/[\sー・\-]/g,'');

  .replace(/[^a-z]/g,'').replace(/ou|oo/g,'o').replace(/uu/g,'u').replace(/aa/g,'a').replace(/ei/g,'e');

// Tách "めんいと / Menito" thành cách đọc kana + romaji
function splitReading(raw,w){
 raw=String(raw||'').trim();const parts=raw.split(/\s*[\/／]\s*/);
 const m=(parts[0]||'').match(/^[぀-ヿ\s　]+/);
 let r=m?m[0].replace(/[\s　]+/g,''):'', ro='';
 if(parts[1]) ro=parts[1].trim();
 else{const rest=(parts[0]||'').slice(m?m[0].length:0).trim(); if(/^[A-Za-zāīūēō' -]+$/.test(rest)) ro=rest}
 if(!r&&isKana(w)) r=String(w).replace(/[\s　]+/g,'');
 return {r,ro};
}

// Bảng chuyển romaji -> hiragana (cho dạng bài gõ)
const RT={};
(()=>{const V='aiueo',rows={'':'あいうえお',k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',r:'らりるれろ',g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
 for(const c in rows)[...rows[c]].forEach((k,i)=>RT[c+V[i]]=k);
 Object.assign(RT,{ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',si:'し',ti:'ち',tu:'つ',hu:'ふ',zi:'じ',di:'ぢ',du:'づ',
  fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',va:'ゔぁ',vi:'ゔぃ',vu:'ゔ',ve:'ゔぇ',vo:'ゔぉ',wi:'うぃ',we:'うぇ',ye:'いぇ',she:'しぇ',che:'ちぇ',je:'じぇ',thi:'てぃ',dhi:'でぃ',
  sha:'しゃ',shu:'しゅ',sho:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',ja:'じゃ',ju:'じゅ',jo:'じょ',xtu:'っ',xtsu:'っ',ltu:'っ'});
 const Y={k:'き',s:'し',t:'ち',c:'ち',n:'に',h:'ひ',m:'み',r:'り',g:'ぎ',z:'じ',j:'じ',b:'び',p:'ぴ',d:'ぢ'};
 for(const c in Y){RT[c+'ya']=Y[c]+'ゃ';RT[c+'yu']=Y[c]+'ゅ';RT[c+'yo']=Y[c]+'ょ'}
 [...'aiueo'].forEach((v,i)=>RT['x'+v]='ぁぃぅぇぉ'[i]);
})();
function romaToHira(s){
 s=String(s||'').normalize('NFKC').toLowerCase();let o='',i=0;const isV=c=>'aiueo'.includes(c);
 while(i<s.length){const c=s[i];
  if(c==='-'){o+='ー';i++;continue}
  if(c==='n'){const n1=s[i+1];
   if(n1==="'"){o+='ん';i+=2;continue}
   if(n1==='n'){const n2=s[i+2];o+='ん';i+=(n2&&(isV(n2)||n2==='y'))?1:2;continue}
   if(!n1||(!isV(n1)&&n1!=='y')){o+='ん';i++;continue}
  }
  if(c===s[i+1]&&/[bcdfghjkmpqrstvwz]/.test(c)){o+='っ';i++;continue}
  if(c==='t'&&s[i+1]==='c'&&s[i+2]==='h'){o+='っ';i++;continue}
  let hit=false;for(const L of [4,3,2,1]){const p=s.substr(i,L);if(RT[p]){o+=RT[p];i+=L;hit=true;break}}
  if(!hit){o+=c;i++}
 }
 return o;
}

/* ================= ĐỌC CSV / JSON / VĂN BẢN DÁN ================= */
function parseCSV(text,delim){
 text=String(text).replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===delim){row.push(f);f=''}
  else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c;
 }
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()));
}
function parseDelimited(text){
 const first=String(text).split('\n').slice(0,5).join('\n');
 const delim=(first.match(/\t/g)||[]).length>=(first.match(/,/g)||[]).length&&first.includes('\t')?'\t':',';
 return parseCSV(text,delim);
}
// Nhận diện cột theo tên tiêu đề (thứ tự kiểm tra quan trọng)
const COLS=[
 ['exTr',/(dich_cau|dịch câu|dich cau|context.?trans|sentence.?trans|subtitle.?trans|example.?trans|trans.*context)/],
 ['ex',/(vi_du|ví dụ|vi du|context|sentence|subtitle|example|例文|câu)/],
 ['hv',/(hán việt|han viet|han_viet)/],
 ['note',/(ghi chú|ghi chu|ghi_chu|^note)/],
 ['w',/kanji/],
 ['r',/(cach_doc|cách đọc|cach doc|reading|kana|furigana|phonetic|translit|hiragana|読み|pronun|romaji)/],
 ['m',/(nghia|nghĩa|meaning|translation|definition|gloss|dịch|意味)/],
 ['st',/(trang_thai|trạng thái|status)/],
 ['g',/(nhom|nhóm|group|tag|deck|category|chủ đề)/],
 ['w',/(tieng_nhat|tiếng nhật|word|term|lemma|vocab|expression|japanese|日本語|単語|kanji|từ vựng|^từ$|^text$|^front$)/]
];
function detectCols(head){
 const map={w:-1,r:-1,m:-1,ex:-1,exTr:-1,g:-1,st:-1,hv:-1,note:-1};
 head.forEach((h,i)=>{h=String(h).trim().toLowerCase();for(const [f,re] of COLS){if(re.test(h)){if(map[f]<0)map[f]=i;break}}});
 return map;
}
function guessCols(row){
 if(row.length>=3&&isKana(row[1])) return {w:0,r:1,m:2,ex:row.length>3?3:-1,exTr:row.length>4?4:-1,g:-1,st:-1,hv:-1,note:-1};
 return {w:0,r:-1,m:1,ex:row.length>2?2:-1,exTr:row.length>3?3:-1,g:-1,st:-1,hv:-1,note:-1};
}
function rowsToItems(rows,src,defG){
 if(!rows.length) return [];
 let head=detectCols(rows[0]),start=1;
 if(head.w<0||head.m<0){head=null;start=0} // không có tiêu đề → đoán cột theo từng dòng
 return rows.slice(start).map(r=>{
  const map=head||guessCols(r);const g=i=>i>=0?String(r[i]??'').trim():'';const w=g(map.w);const rd=splitReading(g(map.r),w);
  return {w,r:rd.r,ro:rd.ro,m:g(map.m),ex:g(map.ex),exTr:g(map.exTr),hv:g(map.hv),note:g(map.note),g:g(map.g)||defG||(src==='lr'?'Language Reactor':''),st:g(map.st),src};
 });
}
function jsonToRows(data){
 if(!Array.isArray(data)){const arr=Object.values(data||{}).find(Array.isArray);data=arr||[]}
 if(!data.length) return [];
 if(Array.isArray(data[0])) return data.map(r=>r.map(x=>String(x??'')));
 const flat=o=>{const r={};for(const k in o){const v=o[k];if(v&&typeof v==='object'&&!Array.isArray(v)){for(const k2 in v)r[k+'_'+k2]=v[k2]}else r[k]=Array.isArray(v)?v.join(', '):v}return r};
 const objs=data.map(flat);const keys=[...new Set(objs.flatMap(Object.keys))];
 return [keys,...objs.map(o=>keys.map(k=>String(o[k]??'')))];
}
function parsePasted(text){
 text=String(text).trim();
 if(text.includes('\t')||/^[^\n]*,[^\n]*,/.test(text)) return parseDelimited(text);
 return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\s*[:=＝：]\s*|\s+[-–—]\s+/));
}

const normM=s=>String(s||'').toLowerCase().normalize('NFC').replace(/[\s().,;]+/g,' ').trim();
function importItems(items){
 const st={added:0,dup:0,existing:0,bad:0,skipped:0,keys:new Set()};const seen=new Set();const d=today();
 for(const it of items){
  if(!it.w||!it.m){st.bad++;continue}
  const k=normKey(it.w);if(!k){st.bad++;continue}
  if(DEL.has(k)){st.skipped++;continue}
  let rec=W[k];
  if(!rec){rec=W[k]={k,src:[it.src],added:it.added||Date.now()};for(const f of WF)rec[f]=it[f]||'';st.added++;st.keys.add(k)}
  else{
   seen.has(k)?st.dup++:st.existing++;
   const before=JSON.stringify(rec);
   if(!rec.src.includes(it.src)) rec.src.push(it.src);
   if(!rec.edited){
    for(const f of ['r','ro','hv','ex','exTr','g','note']) if(!rec[f]&&it[f]) rec[f]=it[f];
    const a=normM(rec.m),b=normM(it.m);
    if(b&&!a.includes(b)){ if(b.includes(a)) rec.m=it.m; else rec.m=rec.m+'; '+it.m }
   }
   if(JSON.stringify(rec)!==before) st.keys.add(k);
  }
  if(/^KNOWN$/i.test(it.st||'')&&!P[k]){P[k]={lv:4,due:d+1+(Math.random()*21|0),reps:1,lapses:0,ok:0,ng:0,last:-1};st.keys.add(k)}
  seen.add(k);
 }
 st.keys.forEach(cDirty);
 return st;
}

const IV=[1,3,7,14,30,60,120,240]; // số ngày giữa các lần ôn theo cấp độ
function sched(p,g,d){
 p=Object.assign({lv:0,due:d,reps:0,lapses:0,ok:0,ng:0,last:-1},p);
 const same=p.last===d&&p.reps>0; // đã ôn trong hôm nay → không tăng cấp 2 lần
 if(g===1){p.lv=0;p.lapses++;p.due=d+1}
 else if(g===2){p.lv=Math.max(1,p.lv);p.due=d+Math.max(1,Math.round(IV[p.lv-1]/2))}
 else{if(!same||p.lv===0)p.lv=Math.min(IV.length,p.lv+(g===4?2:1));p.due=d+IV[p.lv-1]}
 p.reps++;p.last=d;return p;
}
function grade(k,g){P[k]=sched(P[k],g,today());markDay();saveP();cDirty(k)}
function markDay(){const d=today();if(!META.days.includes(d)){META.days.push(d);META.days=META.days.slice(-400);saveMeta()}}
function nextLabel(k,g){if(g===1) return 'học lại';const p=sched(P[k],g,today());const n=p.due-today();return n+' ngày'}
const status=k=>!P[k]?'new':P[k].lv>=4?'done':'learn';
const statusBadge=k=>({new:'<span class="badge b-new">Chưa học</span>',learn:'<span class="badge b-learn">Đang học</span>',done:'<span class="badge b-done">Đã thuộc</span>'})[status(k)];
function streak(){const s=new Set(META.days);let d=today();if(!s.has(d))d--;let n=0;while(s.has(d)){n++;d--}return n}
function stats(){let learn=0,done=0,ok=0,ng=0;for(const k in P){if(!W[k])continue;P[k].lv>=4?done++:learn++;ok+=P[k].ok||0;ng+=P[k].ng||0}
 return {total:Object.keys(W).length,learn,done,acc:ok+ng?Math.round(ok/(ok+ng)*100)+'%':'—'}}


/* ================= TẠO CÂU HỎI TRẮC NGHIỆM ================= */
const DAK={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
const UNDAK=Object.fromEntries(Object.entries(DAK).map(([a,b])=>[b,a]));
const ODAN='おこそとのほもよろごぞどぼぽょ';
// Sinh cách đọc "gần giống" để làm đáp án nhiễu (bỏ/thêm っ, trường âm, dakuten…)
function mutations(r){
 const c=[...r],out=new Set(),put=a=>{const s=a.join('');if(s&&s!==r)out.add(s)};
 c.forEach((ch,i)=>{
  if(DAK[ch]){const a=[...c];a[i]=DAK[ch];put(a)}
  if(UNDAK[ch]){const a=[...c];a[i]=UNDAK[ch];put(a)}
  if(ch==='っ'||(ch==='う'&&i>0&&ODAN.includes(c[i-1]))||(ch==='い'&&i>0&&'えけせてねへめれげぜでべ'.includes(c[i-1]))){const a=[...c];a.splice(i,1);put(a)}
  if(ODAN.includes(ch)&&c[i+1]!=='う'&&(i===c.length-1||'んっ'.includes(c[i+1]))){const a=[...c];a.splice(i+1,0,'う');put(a)}
  if(i>0&&/[かきくけこさしすせそたちつてとぱぴぷぺぽ]/.test(ch)&&!'っんゃゅょぁぃぅぇぉー'.includes(c[i-1])){const a=[...c];a.splice(i,0,'っ');put(a)}
  if(ch==='ょ'||ch==='ゅ'){const a=[...c];a[i]=ch==='ょ'?'ゅ':'ょ';put(a)}
 });
 return [...out];
}
function distractors(w,n,val,filter){
 const v0=val(w),len0=[...v0].length,seen=new Set([v0.trim().toLowerCase()]),out=[];
 const cands=Object.values(W).filter(x=>x.k!==w.k&&val(x)&&(!filter||filter(x)))
  .map(x=>({v:val(x),s:(x.g&&x.g===w.g?2:0)+(Math.abs([...val(x)].length-len0)<=1?1:0)+Math.random()*2.5}))
  .sort((a,b)=>b.s-a.s);
 for(const c of cands){const nv=c.v.trim().toLowerCase();if(seen.has(nv))continue;seen.add(nv);out.push(c.v);if(out.length>=n)break}
 return out;
}
function eligible(w){
 const t=[];const on=x=>S.quizTypes[x];
 if(on('meaning'))t.push(['meaning',3]);
 if(on('reverse'))t.push(['reverse',2]);
 if(on('reading')&&w.r&&hasKanji(w.w))t.push(['reading',2.5]);
 if(on('cloze')&&w.ex&&w.ex.includes(w.w)&&w.ex!==w.w)t.push(['cloze',3]);
 if(on('type')&&w.r)t.push(['type',1.5]);
 return t.length?t:[['meaning',1]];
}
function buildQ(k){
 const w=W[k],types=eligible(w);let r=Math.random()*types.reduce((s,t)=>s+t[1],0),type=types[0][0];
 for(const [t,wt] of types){r-=wt;if(r<=0){type=t;break}}
 let correct,others=[],jp=true;
 if(type==='meaning'){correct=w.m;others=distractors(w,3,x=>x.m);jp=false}
 else if(type==='reading'){correct=w.r;const syn=shuffle(mutations(kata2hira(w.r))).slice(0,2);
  others=[...new Set([...syn,...distractors(w,3,x=>hasKanji(x.w)?x.r||'':'')])].filter(x=>x!==w.r).slice(0,3)}
 else if(type!=='type'){correct=w.w;others=distractors(w,3,x=>x.w)}
 const opts=type==='type'?[]:shuffle([{label:correct,ok:true},...others.map(l=>({label:l,ok:false}))]);
 return {k,type,opts,jp,done:false,pick:-1,right:null,input:''};
}

function checkTyped(v,w){
 if(!String(v).trim()) return false;
 const a=cleanKana(romaToHira(v)),e=cleanKana(w.r);
 if(a&&e&&a===e) return true;
 const x=normRo(v),y=normRo(w.ro);return !!(x&&y&&x===y);
}
function afterAnswer(){
 const q=SES.q,k=q.k,first=!SES.requeued.has(k);
 if(first){grade(k,q.right?3:1);P[k][q.right?'ok':'ng']=(P[k][q.right?'ok':'ng']||0)+1;saveP();q.right?SES.ok++:SES.ng++}
 if(!q.right&&first){SES.queue.push(k);SES.requeued.add(k)} // sai → hỏi lại ở cuối phiên
 render();afterQRender();
}

/* Đọc file JSON xuất từ Language Reactor (mỗi mục có word, wordTranslationsArr, context…) */
const clean=s=>String(s||'').replace(/[\u200e\u200f\u202a-\u202e]/g,'').replace(/\s*\n\s*/g,' ').trim();
function lrJsonToItems(arr){
 return arr.filter(x=>x&&x.word&&x.word.text).map(x=>{
  const ph=(x.context&&x.context.phrase)||{},subs=ph.subtitles||{},w=x.word.text,ref=ph.reference||{};
  let i=Object.keys(subs).find(j=>clean(subs[j]).includes(w));if(i==null)i='1' in subs?'1':Object.keys(subs)[0];
  return {w,r:kata2hira(x.word.translit||''),ro:'',m:(x.wordTranslationsArr||[]).join(', '),ex:clean(subs[i]),
   exTr:clean((ph.hTranslations||{})[i]||(ph.mTranslations||{})[i]),g:(ref.title_arr||[])[0]||ref.diocoDocName||'',st:x.learningStage||'',src:'lrfile'};
 });
}

/* Đọc file Excel (.xlsx): file xuất từ Language Reactor hoặc bảng từ vựng tự soạn */
function plausibleReading(w,r){
 if(!r||!/^[ぁ-ゟー]+$/.test(r)) return false;let p='';
 for(const ch of kata2hira(String(w).normalize('NFKC'))){
  if(hasKanji(ch)){if(!p.endsWith('.+'))p+='.+'}else if(/[ぁ-ゟー]/.test(ch))p+=ch;else return false}
 return new RegExp('^'+p+'$').test(r);
}
// Language Reactor chỉ cho romaji của dạng xuất hiện trong phụ đề → suy ra cách đọc của dạng từ điển (lemma)
function lemmaReading(word,lemma,tr){
 if(isKana(lemma)) return kata2hira(lemma.replace(/[\s　]/g,''));
 const r=romaToHira(String(tr||'').replace(/\s/g,''));
 if(word===lemma) return plausibleReading(lemma,r)?r:'';
 if(isKana(word)&&!hasKanji(lemma.slice(-1))&&plausibleReading(lemma,kata2hira(word))) return kata2hira(word);
 let n=0;while(n<Math.min(word.length,lemma.length)&&word[n]===lemma[n])n++;
 if(!n) return '';
 const ws=kata2hira(word.slice(n)),ls=kata2hira(lemma.slice(n));
 if((ws&&!isKana(ws))||(ls&&!isKana(ls))||!r.endsWith(ws)) return '';
 const c=r.slice(0,r.length-ws.length)+ls;return plausibleReading(lemma,c)?c:'';
}
function lrXlsxToItems(rows){
 const H={};rows[0].forEach((h,i)=>H[String(h).trim()]=i);const g=(r,c)=>H[c]==null?'':clean(r[H[c]]);
 return rows.slice(1).map(r=>{
  const word=g(r,'Word'),lemma=g(r,'Lemma')||word,hum=String(r[H['Context human translation']]??'').split('\n').map(clean);
  const ts=Date.parse(String(g(r,'Date created')).replace(' ','T')+':00+07:00');
  return {w:lemma,r:lemmaReading(word,lemma,g(r,'Word transliteration')),ro:'',m:g(r,'Word definition'),ex:g(r,'Subtitle'),
   exTr:hum.length===3&&hum[1]?hum[1]:g(r,'Translation'),g:g(r,'Video title').replace(/\s+T\d+\s+Tập\s+\d+$/,''),st:'',src:'lrfile',added:isNaN(ts)?0:ts};
 });
}
async function importXlsx(file){
 toast('Đang đọc file Excel…');
 let X;try{X=await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs')}catch(e){toast('Không tải được thư viện đọc Excel — kiểm tra mạng, hoặc xuất file JSON/CSV');return}
 try{
  const wb=X.read(await file.arrayBuffer(),{type:'array'});let items=[];
  for(const name of wb.SheetNames){
   const rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false}).map(r=>r.map(x=>String(x??'')));
   if(!rows.length) continue;
   if(rows[0].includes('Item key')&&rows[0].includes('Lemma')) items=items.concat(lrXlsxToItems(rows));
   else items=items.concat(rowsToItems(rows,'lrfile',name));
  }
  if(!items.length){toast('Không tìm thấy từ vựng trong file');return}
  importLR(null,items);
 }catch(e){toast('Không đọc được file Excel')}
}
function readFile(f,cb){const r=new FileReader();r.onload=()=>cb(String(r.result));r.onerror=()=>toast('Không đọc được file');r.readAsText(f,'utf-8')}
document.addEventListener('keydown',e=>{
 if(view!=='session'||!SES||$('#dlg').open)return;
 if(e.target.matches('input,textarea,select'))return;
 if(e.key==='Escape'){ACT.quit();return}
 if(SES.pos>=SES.queue.length)return;
 if(SES.kind==='cards'){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();ACT.flip()}
  else if(SES.flipped&&/^[1-4]$/.test(e.key)){e.preventDefault();ACT.rate({g:e.key})}
 }else{const q=SES.q;
  if(!q.done&&q.type!=='type'&&/^[1-4]$/.test(e.key)&&+e.key<=q.opts.length){e.preventDefault();answerChoice(+e.key-1)}
  else if(q.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ACT.next()}
 }
});

// Gộp từ vựng gắn sẵn vào kho (bỏ qua từ trùng / đã xoá) — chạy một lần cho mỗi phiên bản dữ liệu
function seedWords(){
 if(META.lrVer===SEED_VER) return;
 const st=importItems(LR_EMBED.map(x=>({w:x[0],r:x[1],ro:'',m:x[2],ex:x[3],exTr:x[4],g:x[5],st:x[6]?'KNOWN':'',added:x[7],hv:x[8]||'',note:x[9]||'',src:'lr'})));
 META.lrVer=SEED_VER;META.lrInfo='Dữ liệu có sẵn ('+LR_DATE+') — '+statText(st);
 if(TODAY&&todayIds().length<S.daily) topUpToday();
}

/* ================= ĐỒNG BỘ FIRESTORE ================= */
const FB_CONFIG={
 apiKey:"AIzaSyDGKWJFcMdgV_bjPinEXoW5yXsncLSEQis",
 authDomain:"proj-af85a.firebaseapp.com",
 projectId:"proj-af85a",
 storageBucket:"proj-af85a.firebasestorage.app",
 messagingSenderId:"117769328124",
 appId:"1:117769328124:web:1ceb0d23f37b7e38f6ce79"
};
const COLL='hoctiengnhatlanguagereactor';
const STATE_ID='_state';                 // 1 tài liệu chứa cài đặt, danh sách từ đã xoá, lịch sử ngày học, bộ từ hôm nay
const FB_SDK='https://www.gstatic.com/firebasejs/10.12.2/';
const CLOUD={db:null,fs:null,status:'loading',msg:'',dirty:new Set(),gone:new Set(),stateDirty:false,timer:null,busy:false,known:new Set(),pulledAt:0,maxT:0};
// Mỗi từ là 1 tài liệu: id = "w_" + khoá chuẩn hoá (thay "/" vì Firestore không cho phép)
const docId=k=>'w_'+k.replace(/\//g,'／');
const plain=o=>JSON.parse(JSON.stringify(o)); // bỏ các giá trị undefined
const errMsg=e=>e&&e.code==='permission-denied'?'Firestore từ chối quyền — hãy mở quyền đọc/ghi cho collection '+COLL+' trong Firestore Rules':(e&&(e.message||e.code))||String(e);
function cloudLabel(){return {ok:'☁️ Đã đồng bộ',saving:'☁️ Đang lưu…',loading:'☁️ Đang tải…',err:'⚠️ Lỗi đồng bộ',off:'☁️ Ngoại tuyến'}[CLOUD.status]||'☁️'}
function setCloud(st,msg){CLOUD.status=st;CLOUD.msg=msg||'';const el=$('#cloud');if(el){el.className='cloud '+st;el.textContent=cloudLabel();el.title=CLOUD.msg||('Firestore: '+COLL)}}
function cDirty(k){CLOUD.dirty.add(k);CLOUD.gone.delete(k);schedFlush()}
function cGone(k){CLOUD.gone.add(k);CLOUD.dirty.delete(k);schedFlush()}
function cState(){CLOUD.stateDirty=true;schedFlush()}
function schedFlush(ms=1200){if(!CLOUD.db)return;if(CLOUD.status!=='err')setCloud('saving');clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(flush,ms)}
const wordDoc=k=>Object.assign(plain(W[k]),{p:P[k]?plain(P[k]):null,t:CLOUD.fs.serverTimestamp()});
const stateDoc=()=>({settings:plain(S),del:[...DEL],meta:plain(META),today:TODAY?plain(TODAY):null,t:CLOUD.fs.serverTimestamp()});
async function flush(){
 if(!CLOUD.db)return;
 if(CLOUD.busy){schedFlush();return}
 const ops=[...[...CLOUD.gone].map(k=>['del',k]),...[...CLOUD.dirty].map(k=>['put',k])];
 if(CLOUD.stateDirty) ops.push(['state']);
 if(!ops.length){setCloud('ok');return}
 CLOUD.gone.clear();CLOUD.dirty.clear();CLOUD.stateDirty=false;CLOUD.busy=true;
 const {doc,writeBatch}=CLOUD.fs;let i=0;
 try{
  for(;i<ops.length;i+=400){const b=writeBatch(CLOUD.db),part=ops.slice(i,i+400);
   for(const [t,k] of part){
    if(t==='state') b.set(doc(CLOUD.db,COLL,STATE_ID),stateDoc());
    else if(t==='del'||!W[k]) b.delete(doc(CLOUD.db,COLL,docId(k)));
    else b.set(doc(CLOUD.db,COLL,docId(k)),wordDoc(k));
   }
   await b.commit();
   part.forEach(([t,k])=>{if(t!=='state')W[k]&&t==='put'?CLOUD.known.add(k):CLOUD.known.delete(k)});
  }
  setCloud(CLOUD.dirty.size||CLOUD.gone.size||CLOUD.stateDirty?'saving':'ok');
 }catch(e){ // trả lại các thao tác chưa ghi được, thử lại sau
  for(const [t,k] of ops.slice(i)){if(t==='state')CLOUD.stateDirty=true;else if(t==='del'){if(!CLOUD.dirty.has(k))CLOUD.gone.add(k)}else if(!CLOUD.gone.has(k))CLOUD.dirty.add(k)}
  setCloud('err',errMsg(e));clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(flush,20000);
 }finally{CLOUD.busy=false}
}
function applyState(st){
 S=Object.assign({},DEF,st.settings||{});S.quizTypes=Object.assign({},DEF.quizTypes,S.quizTypes);
 DEL=new Set(st.del||[]);META=Object.assign({lrInfo:'',days:[]},st.meta||{});TODAY=st.today||null;
}
function readWordDoc(d){const x=d.data(),tm=x.t&&x.t.toMillis?x.t.toMillis():0;if(tm>CLOUD.maxT)CLOUD.maxT=tm;
 if(d.id===STATE_ID) return {state:x};const {p,t,...rec}=x;return rec.k?{rec,p}:null}
// full=true: tải toàn bộ collection; full=false: chỉ tải các tài liệu thay đổi từ lần trước (tiết kiệm lượt đọc)
async function pullCloud(full){
 const fs=CLOUD.fs,col=fs.collection(CLOUD.db,COLL);
 const snap=await fs.getDocs(full||!CLOUD.maxT?col:fs.query(col,fs.where('t','>',fs.Timestamp.fromMillis(CLOUD.maxT))));
 if(full) CLOUD.maxT=0;
 let st=null;const w={},p={};
 snap.forEach(d=>{const r=readWordDoc(d);if(!r)return;if(r.state){st=r.state;return}w[r.rec.k]=r.rec;if(r.p)p[r.rec.k]=r.p});
 CLOUD.pulledAt=Date.now();
 if(full&&snap.empty){ // Firestore còn trống → đẩy dữ liệu đang có trên máy lên (kể cả tiến độ học cũ)
  seedWords();ensureToday();Object.keys(W).forEach(cDirty);cState();saveAll();saveS();render();return;
 }
 const keepLocal=k=>CLOUD.dirty.has(k)||CLOUD.gone.has(k); // thay đổi trên máy chưa kịp lưu thì giữ lại
 if(full){
  const oldW=W,oldP=P;W={};P={};CLOUD.known=new Set(Object.keys(w));
  for(const k in w){W[k]=w[k];if(p[k])P[k]=p[k]}
  for(const k of CLOUD.dirty){if(oldW[k])W[k]=oldW[k];if(oldP[k])P[k]=oldP[k];else delete P[k]}
  for(const k of CLOUD.gone){delete W[k];delete P[k]}
 }else{
  for(const k in w){if(keepLocal(k))continue;W[k]=w[k];if(p[k])P[k]=p[k];else delete P[k];CLOUD.known.add(k)}
 }
 if(st&&!CLOUD.stateDirty) applyState(st);
 for(const k of DEL){if(W[k]&&!CLOUD.dirty.has(k)){delete W[k];delete P[k]}}
 if(full) seedWords();
 if(TODAY) TODAY.ids=TODAY.ids.filter(k=>W[k]);
 LS.set('jp_settings',S);saveW();saveP();LS.set('jp_del',[...DEL]);LS.set('jp_meta',META);LS.set('jp_today',TODAY);
 applyTheme();
 if(!TODAY||TODAY.day!==today()){ensureToday()}
 if(view!=='session') render();
 if(CLOUD.dirty.size||CLOUD.gone.size||CLOUD.stateDirty) schedFlush(300); else setCloud('ok');
}
function cloudFail(e){setCloud('err',errMsg(e));if(e&&e.code==='permission-denied')toast('⚠️ '+errMsg(e),8000)}
async function cloudInit(){
 try{
  const [app,fs]=await Promise.all([import(FB_SDK+'firebase-app.js'),import(FB_SDK+'firebase-firestore.js')]);
  const fa=app.initializeApp(FB_CONFIG);let db;
  try{db=fs.initializeFirestore(fa,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}
  catch(e){db=fs.getFirestore(fa)}
  CLOUD.fs=fs;CLOUD.db=db;
  await pullCloud(true);
 }catch(e){
  // Không kết nối được Firestore → vẫn học bình thường với dữ liệu trong trình duyệt
  if(!CLOUD.db){seedWords();saveAll();ensureToday();render();setCloud('off','Không tải được Firebase — đang dùng dữ liệu trong trình duyệt. '+errMsg(e))}
  else cloudFail(e);
  render();
 }
}

(function boot(){
 applyTheme();
 for(const k of ['lastSync','lastFail','syncInfo']) delete META[k];
 for(const k of ['syncTime','sheetUrl','trustSheet']) delete S[k];
 ensureToday();render();   // hiển thị ngay dữ liệu đã lưu trong trình duyệt, rồi tải từ Firestore
 cloudInit();
 setInterval(checkDay,60*1000); // kiểm tra sang ngày mới mỗi phút
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(CLOUD.db&&(CLOUD.dirty.size||CLOUD.gone.size||CLOUD.stateDirty))flush();return}
  checkDay();
  // quay lại tab → lấy các thay đổi từ máy khác (chỉ đọc tài liệu đã đổi)
  if(CLOUD.db&&view!=='session'&&!CLOUD.busy&&Date.now()-CLOUD.pulledAt>60000) pullCloud(false).catch(cloudFail);
 });
})();
